name: Build Kam Module

on:
  workflow_dispatch:
    inputs:
      release:
        description: Create GitHub release and upload artifacts
        required: false
        type: boolean
        default: false
      prerelease:
        description: Mark GitHub release as a pre-release
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  actions: read

concurrency:
  group: kam-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KAM_PRIVATE_KEY_AVAILABLE: ${{ secrets.KAM_PRIVATE_KEY != '' && '1' || '0' }}
      KAM_SIGN_ENABLED: ${{ inputs.release == true && secrets.KAM_PRIVATE_KEY != '' && '1' || '0' }}
      KAM_SIGN_REQUIRED: ${{ inputs.release == true && '1' || '0' }}
      KAM_CHANGELOG_ENABLED: '0'
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache Cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Setup kam
        uses: MemDeco-WG/setup-kam@1d6ad8a9f58446a4519fda12a52f0c71fb667d8b # v3
        with:
          github-token: ${{ github.token }}
          enable-cache: 'true'
          cache-targets: cargo,kam
          install-commitizen: 'false'
          private-key: ${{ secrets.KAM_PRIVATE_KEY }}

      - name: Require developer key for release
        if: ${{ inputs.release == true }}
        shell: bash
        run: test "$KAM_PRIVATE_KEY_AVAILABLE" = 1

      - name: Install artifact tools
        run: sudo apt-get update && sudo apt-get install -y unzip zip

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install Android Rust targets
        shell: bash
        run: |
          set -euo pipefail
          sysroot="$(rustc --print sysroot)"
          rm -rf "${sysroot}/lib/rustlib/aarch64-linux-android"
          rustup target add aarch64-linux-android

      - name: Install Android cargo build tool
        run: cargo install cargo-ndk --locked

      - name: Build device kam binary
        shell: bash
        run: |
          set -euo pipefail
          kam_src="$RUNNER_TEMP/kam-src"
          git clone --depth 1 --branch v0.6.14 https://github.com/MemDeco-WG/Kam.git "$kam_src"
          (cd "$kam_src" && cargo ndk --target arm64-v8a --platform 23 build --release --locked)
          mkdir -p src/AnyMeta/bin
          install -m 0755 "$kam_src/target/aarch64-linux-android/release/kam" src/AnyMeta/bin/kam

      - name: Verify tools
        shell: bash
        run: |
          set -euo pipefail
          kam --version
          gh --version
          cargo ndk --version

      - name: Build module
        shell: bash
        run: |
          set -euo pipefail
          find hooks src -type f -name '*.sh' -exec chmod +x {} + 2>/dev/null || true
          tests/controller-smoke.sh
          printf '%s  %s\n' 279d85a6a35724dfcf8aa1137a9630c7e989e154b94543517c539ee70f9b8811 src/AnyMeta/seed/meta-overlayfs.zip | sha256sum -c -
          rm -rf dist
          kam build

      - name: Verify artifact contents
        shell: bash
        run: |
          set -euo pipefail
          module_id="$(sed -n 's/^id[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' kam.toml | head -n1)"
          test -n "$module_id"
          test -f "dist/${module_id}.zip"
          unzip -Z1 "dist/${module_id}.zip" | grep -Fx 'module.prop'
          unzip -Z1 "dist/${module_id}.zip" | grep -Fx 'bin/kam'
          ! unzip -Z1 "dist/${module_id}.zip" | grep -E '(^|/)\.git($|/)'

      - name: Build standalone module installer
        shell: bash
        run: |
          set -euo pipefail
          kam validate installer
          kam build installer --quiet
          test -s installer/dist/anymeta-installer.zip
          unzip -Z1 installer/dist/anymeta-installer.zip | grep -Fx 'bin/module-downloader'
          unzip -p installer/dist/anymeta-installer.zip download.json | grep -F '"module_id": "AnyMeta"'
          cp installer/dist/anymeta-installer.zip dist/anymeta-installer.zip

      - name: Sign and verify release assets
        if: ${{ inputs.release == true }}
        shell: bash
        env:
          SIGNING_KEY_PEM: ${{ secrets.KAM_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/anymeta-developer.pem"
          public="$RUNNER_TEMP/anymeta-developer.public.pem"
          printf '%s' "$SIGNING_KEY_PEM" > "$key"
          chmod 0600 "$key"
          openssl pkey -in "$key" -pubout -out "$public"
          for asset in dist/AnyMeta.zip dist/anymeta-installer.zip; do
            kam sign "$asset" --key-path "$key" --out dist
            kam verify "$asset" --key "$public"
          done

      - name: Create GitHub release
        if: ${{ inputs.release == true }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--all-assets)
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            args+=(--prerelease)
          fi
          kam publish "${args[@]}"

      - name: Upload build artifact
        if: always() && hashFiles('dist/*') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kam-module-artifact
          path: dist/*
          if-no-files-found: error
