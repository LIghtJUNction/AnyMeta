name: Update backend index

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh KernelSU backend catalog
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://modules.kernelsu.org/modules.json -o /tmp/meta_modules.json
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from pathlib import Path

          def get(url):
              request = urllib.request.Request(url, headers={'User-Agent': 'AnyMeta-index/1'})
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          p=Path('src/AnyMeta/backends.json')
          current=json.loads(p.read_text())
          upstream=json.loads(Path('/tmp/meta_modules.json').read_text())
          official_ids={item['moduleId'] for item in upstream if item.get('metamodule')}
          for backend in current:
              repo=backend['repo']
              if backend['id'] in official_ids:
                  try:
                      detail=get('https://modules.kernelsu.org/module/'+urllib.parse.quote(backend['id'], safe='')+'.json')
                      repo=detail.get('url') or backend['repo']
                      backend['repo']=repo
                  except Exception as error:
                      print(f"warning: retained metadata for {backend['id']}: {error}")
              try:
                  slug=repo.removeprefix('https://github.com/').rstrip('/')
                  release=get('https://api.github.com/repos/'+slug+'/releases/latest')
                  assets=[a for a in release.get('assets', []) if a.get('name','').lower().endswith('.zip') and '-debug.zip' not in a.get('name','').lower()]
                  if 'arm64' in backend.get('asset',''):
                      arm64=[a for a in assets if 'arm64' in a.get('name','').lower()]
                      assets=arm64 or assets
                  if assets:
                      asset=assets[0]
                      backend['release']=release['tag_name']
                      backend['asset']=asset['name']
                      digest=asset.get('digest') or ''
                      backend['sha256']=digest.removeprefix('sha256:') if digest.startswith('sha256:') else ''
              except Exception as error:
                  print(f"warning: retained release for {backend['id']}: {error}")
          p.write_text(json.dumps(current,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Open catalog update
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore: refresh KernelSU backend catalog'
          title: 'chore: refresh KernelSU backend catalog'
          branch: automation/backend-index
