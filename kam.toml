[prop]
id = "AnyMeta"
name = "AnyMeta"
version = "v0.1.0"
versionCode = 1789327934710
author = "LIghtJUNction"
description = "Switch KernelSU metamodule backends without losing module data"
updateJson = "https://raw.githubusercontent.com/LIghtJUNction/AnyMeta/main/update.json"
metamodule = true

[mmrl.repo]
license = "MIT"
license_file = "LICENSE"
homepage = ""
readme = ""
readme_file = "README.md"
changelog = ""
changelog_file = "CHANGELOG.md"
screenshots = []
categories = ["tools"]
keywords = [
    "kam",
    "module",
    "android",
    "template",
]
maintainers = []
repository = "https://github.com/LIghtJUNction/AnyMeta"
documentation = ""
issues = ""
funding = "https://github.com/sponsors/LightJunction"
support = ""
donate = ""
cover = ""
icon = "icon.png"
devices = []
arch = ["arm64-v8a"]
require = []
antifeatures = []
max_num = 0
min_api = 21
max_api = 35
verified = false
features = [
    "module-template",
    "customization",
]

[mmrl.repo.note]
title = ""
message = ""

[mmrl.repo.manager.magisk]
devices = []
arch = []
require = []

[mmrl.repo.manager.kernelsu]
devices = []
arch = []
require = []

[mmrl.repo.manager.apatch]
devices = []
arch = []
require = []

[mmrl.repo.options.archive]
compression = ""

[kam]
min_api = 0
max_api = 0
supported_arch = []
conflicts = []
module_type = "kam"

[kam.build]
source_dir = "src/AnyMeta"
target_dir = "dist"
output_file = "{{id}}"
hooks_dir = "hooks"
exclude = [
    ".git/",
    "target/",
    "node_modules/",
    ".DS_Store",
    "Thumbs.db",
    "*.tmp",
    "*.log",
    "*.bak",
    ".kam/",
]
include = []
respect_gitignore = false

[kam.tmpl.variables.repository]
var_type = "string"
required = false
default = ""
note = "GitHub repository URL (optional)"
help = "The GitHub repository URL where your module source code is hosted"
example = "https://github.com/user/repo"

[kam.workspace]
members = ["."]

[dev.sync]
stage_dir = "/sdcard/Download/kam-dev/AnyMeta"
mirror = ["webroot/**"]
preserve = [
    ".config/**",
    "config.yaml",
    "config.yml",
    "subscriptions/**",
    "*.user.yaml",
    "*.user.yml",
]
ignore = [
    "logs/**",
    ".log/**",
    "cache/**",
    "*.bak",
    "*.kam-tmp",
]

[tool]
