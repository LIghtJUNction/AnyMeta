<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnyMeta</title><style>
:root{color-scheme:light;--bg:#f2efe8;--paper:#fffdf8;--ink:#262923;--muted:#777a71;--line:#d7d4ca;--accent:#4b755c;--warn:#9a6a26}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:900px;margin:auto;padding:22px 16px 38px}.bar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:15px}.brand{font-size:24px;font-weight:720}.state,.desc,.meta{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:11px;margin-top:20px}.item{background:var(--paper);border:1px solid var(--line);padding:15px;min-height:160px;display:flex;flex-direction:column}.item.active{border-color:var(--accent)}h2{font-size:18px;margin:0 0 5px}.desc{margin:0 0 12px;flex:1}.actions,.tools{display:flex;gap:7px;margin-top:11px}button{border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 11px;font:inherit;cursor:pointer}button:hover,button:focus-visible{border-color:var(--accent);outline:2px solid #4b755c33;outline-offset:1px}button.primary{background:var(--accent);border-color:var(--accent);color:white}button:disabled{opacity:.5;cursor:wait}.notice{display:none;margin-top:18px;padding:10px 12px;border:1px solid #d5be91;background:#fff8e9;color:var(--warn)}.log{display:none;margin-top:12px;padding:11px;background:#e9e6dd;border:1px solid var(--line);white-space:pre-wrap;color:var(--muted);font:14px/1.5 ui-monospace,monospace}.remote{display:none;width:100%;height:72vh;border:0;margin-top:17px;background:var(--paper)}@media(max-width:560px){main{padding:17px 12px 28px}.grid{grid-template-columns:1fr}.bar{align-items:flex-start}}
</style></head><body><main><header class="bar"><div class="brand">AnyMeta</div><div id="state" class="state">检查中</div></header><section id="fallback"><div id="grid" class="grid"></div><div id="notice" class="notice"></div><div class="tools"><button id="backup" class="primary">备份</button><button id="refresh">刷新</button><button id="doctor">诊断</button></div><pre id="log" class="log"></pre></section><iframe id="remote" class="remote" title="当前元模块界面"></iframe><script>
const exec=async c=>{if(window.ksu?.exec)return String(window.ksu.exec(c)||'');if(window.kernelsu?.exec){const r=await window.kernelsu.exec(c);return r?.stdout||r?.output||String(r||'')}return ''};const call=c=>exec(`/data/adb/modules/AnyMeta/anymeta.sh ${c}`);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const show=t=>{const x=document.querySelector('#log');x.style.display='block';x.textContent=t};
async function actual(){const r=await exec("for d in /data/adb/modules/*; do [ -f \"$d/module.prop\" ] || continue; [ -f \"$d/remove\" ] && continue; [ -f \"$d/disable\" ] && continue; grep -q '^metamodule=\\(1\\|true\\)' \"$d/module.prop\" && basename \"$d\"; done");return r.trim().split(/\s+/).filter(Boolean)[0]||''}
async function render(){const installed=await actual();if(installed&&installed!=='AnyMeta'){document.querySelector('#fallback').style.display='none';const f=document.querySelector('#remote');f.src=`/data/adb/modules/${encodeURIComponent(installed)}/webroot/index.html`;f.style.display='block';document.querySelector('#state').textContent=installed;return}const [raw,status,update,hasBackendUi]=await Promise.all([call('list'),call('status'),call('check-update'),exec("[ -f /data/adb/modules/AnyMeta/webroot/backend/index.html ] && echo 1")]);const active=(status.match(/active=([^\n]+)/)||[])[1]||'AnyMeta';document.querySelector('#state').textContent=active;if(hasBackendUi.trim()==='1'){document.querySelector('#fallback').style.display='none';const f=document.querySelector('#remote');f.src='backend/index.html';f.style.display='block';return}document.querySelector('#fallback').style.display='block';document.querySelector('#remote').style.display='none';const rows=raw.trim().split('\n').filter(Boolean);document.querySelector('#grid').innerHTML=rows.map(r=>{const [id,name,installed,on,desc]=r.split('\t');return `<article class="item ${on==='1'?'active':''}"><h2>${esc(name)}</h2><p class="desc">${esc(desc)}</p><span class="meta">${esc(id)} · ${installed==='1'?'已安装':'未安装'}</span><div class="actions"><button class="primary" data-use="${esc(id)}" ${on==='1'?'disabled':''}>${on==='1'?'使用中':'启用'}</button><button data-fetch="${esc(id)}">下载</button></div></article>`}).join('');const m=update.match(/current=([^\n]*)[\s\S]*latest=([^\n]*)/);if(m&&m[2]&&m[2].replace(/^v/,'')!==m[1].replace(/^v/,'')){const n=document.querySelector('#notice');n.style.display='block';n.innerHTML=`${esc(m[1])} → ${esc(m[2])} <button id="upgrade">更新</button>`;document.querySelector('#upgrade').onclick=async()=>{show(await call('update'));await render()}}document.querySelectorAll('[data-use]').forEach(b=>b.onclick=async()=>{b.disabled=true;show(await call(`use ${b.dataset.use}`));await render()});document.querySelectorAll('[data-fetch]').forEach(b=>b.onclick=async()=>{b.disabled=true;show(await call(`fetch ${b.dataset.fetch}`));await render()})}
document.querySelector('#refresh').onclick=render;document.querySelector('#backup').onclick=async()=>show(await call('backup'));document.querySelector('#doctor').onclick=async()=>show(await call('doctor'));render();</script></main></body></html>
