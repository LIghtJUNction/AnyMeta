<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AnyMeta</title>
  <style>
    :root{color-scheme:dark;--ink:#edf3f0;--muted:#91a39d;--panel:#14201f;--line:#2a3a37;--accent:#8ee7bd;--warn:#f2c879;--bg:#0b1111}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 0,#183331 0,#0b1111 38%);color:var(--ink);font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1020px;margin:auto;padding:28px 20px 48px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:24px}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.12em;text-transform:uppercase}.title{font-size:clamp(28px,6vw,52px);line-height:1.04;margin:8px 0}.lede{color:var(--muted);max-width:570px;margin:0}.status{border:1px solid #34554b;background:#10231e;padding:12px 14px;min-width:190px}.status b{display:block;color:var(--accent);font-size:18px}.section{padding-top:28px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section h2{font-size:18px;margin:0}.meta{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.card{background:rgba(20,32,31,.9);border:1px solid var(--line);padding:17px;display:flex;flex-direction:column;min-height:194px}.card.active{border-color:var(--accent);box-shadow:inset 3px 0 var(--accent)}.card-top{display:flex;justify-content:space-between;gap:12px}.card h3{margin:0;font-size:17px}.mark{color:var(--accent);font-size:11px;border:1px solid #477b67;padding:2px 6px;height:max-content}.card p{color:var(--muted);margin:10px 0;flex:1}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}.tag{font-size:11px;color:#bad7cb;background:#203632;padding:3px 7px}.actions{display:flex;gap:8px}button{border:1px solid #4a675e;background:#1e322e;color:var(--ink);padding:9px 12px;font:inherit;cursor:pointer}button:hover,button:focus-visible{border-color:var(--accent);outline:none}button.primary{background:var(--accent);color:#082019;border-color:var(--accent);font-weight:650}.toolbar{display:flex;flex-wrap:wrap;gap:8px}.notice{color:var(--warn);border-left:2px solid var(--warn);padding:10px 12px;background:#211e16}.log{white-space:pre-wrap;color:var(--muted);font:12px/1.5 ui-monospace,SFMono-Regular,monospace;background:#080d0d;border:1px solid var(--line);padding:13px;max-height:180px;overflow:auto}footer{color:var(--muted);font-size:12px;margin-top:32px}@media(max-width:620px){main{padding:20px 14px 35px}.top{display:block}.status{margin-top:18px}.card{min-height:0}}
  </style>
</head>
<body><main>
  <header class="top"><div><div class="eyebrow">KernelSU metamodule manager</div><h1 class="title">AnyMeta</h1><p class="lede">把元模块当作可切换后端管理。模块目录、配置和备份始终留在设备上，切换只替换挂载实现。</p></div><div class="status"><span class="meta">当前后端</span><b id="active">读取中…</b><span id="cache" class="meta"></span></div></header>
  <section class="section"><div class="section-head"><h2>挂载后端</h2><span class="meta">一次只启用一个，符合 KernelSU 约束</span></div><div id="cards" class="grid"></div></section>
  <section class="section"><div class="section-head"><h2>维护</h2></div><div class="toolbar"><button id="backup" class="primary">创建完整备份</button><button id="refresh">刷新状态</button><button id="diagnose">运行诊断</button></div><p class="notice">切换前会保留当前后端和缓存。后端下载失败时会自动尝试代理加速；校验失败的包不会被启用。</p><pre id="log" class="log">准备就绪</pre></section>
  <footer>AnyMeta · powered by Kam · 数据目录：/data/adb/AnyMeta</footer>
  <script>
    const exec = async command => { if (window.ksu?.exec) { const r=await window.ksu.exec(command); return r?.stdout||r?.output||String(r) } if (window.kernelsu?.exec) return await window.kernelsu.exec(command); return '请在 KernelSU Manager WebUI 中打开 AnyMeta' };
    const call = async command => exec(`/data/adb/modules/AnyMeta/anymeta.sh ${command}`);
    const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function render(){ const [raw,status]=await Promise.all([call('list'),call('status')]); const active=(status.match(/active=(.*)/)||['',''])[1].trim(); document.querySelector('#active').textContent=active||'未选择'; document.querySelector('#cache').textContent=(status.match(/cache=(.*)/)||['',''])[1]; const rows=raw.trim().split('\n').filter(Boolean); document.querySelector('#cards').innerHTML=rows.map(row=>{const [id,name,installed,on,desc]=row.split('\t');return `<article class="card ${on==='1'?'active':''}"><div class="card-top"><h3>${esc(name)}</h3>${on==='1'?'<span class="mark">ACTIVE</span>':''}</div><p>${esc(desc)}</p><div class="tags"><span class="tag">${installed==='1'?'已缓存':'未下载'}</span><span class="tag">${esc(id)}</span></div><div class="actions"><button class="primary" data-use="${esc(id)}">${on==='1'?'正在使用':'切换到此后端'}</button><button data-fetch="${esc(id)}">${installed==='1'?'重新检查':'下载'}</button></div></article>`}).join(''); document.querySelectorAll('[data-use]').forEach(b=>b.onclick=async()=>{b.disabled=true; document.querySelector('#log').textContent=await call(`use ${b.dataset.use}`); await render()}); document.querySelectorAll('[data-fetch]').forEach(b=>b.onclick=async()=>{b.disabled=true; document.querySelector('#log').textContent=await call(`fetch ${b.dataset.fetch}`); await render()}) }
    document.querySelector('#refresh').onclick=render; document.querySelector('#diagnose').onclick=async()=>document.querySelector('#log').textContent=await call('doctor'); document.querySelector('#backup').onclick=async()=>document.querySelector('#log').textContent=await call('backup'); render();
  </script>
</main></body></html>
